# electron-builder 打包配置（Camera Border App）
#
# 产物布局（extraResources，位于 process.resourcesPath 下）：
#   <resources>/
#     app.asar/                              electron 编译产物（files: dist/**）
#     frontend/                              前端构建产物（app:// 协议加载）
#     java-engine/camera-border-engine.jar   Java 引擎 jar
#     java-runtime/                          随包 Java Runtime（Temurin JRE）
#
# java-runtime 由 scripts/package-app.sh 按当前平台/架构
# 从 runtime/<platform>-<arch>/ 复制到 electron/runtime-bundle/java-runtime，
# 本配置只引用固定目录，避免 per-arch 路径模板漂移。
#
# 构建入口见 scripts/package-app.sh；干净机器验证清单见 docs/release-checklist.md。

appId: com.camborder.desktop
productName: Camera Border
# 产物名带 -arch 后缀：随包 Java Runtime 必须与目标架构一致（每次只构建一个架构）
artifactName: "Camera-Border-${version}-${arch}.${ext}"

directories:
  output: release
  buildResources: build

# macOS 本地构建的 ad-hoc 签名钩子；Windows 不使用签名。
afterPack: ./build-hooks/afterPack.cjs

# 只打包 electron 编译产物与 package.json；
# 前端 / jar / Java Runtime 走 extraResources（asar 外，JavaBridge 可直接 spawn）。
files:
  - dist/**/*
  - package.json

asar: true

# worker_threads 需要真实文件路径；HEIC worker 随 app.asar 一起发布，但解包到
# resources/app.asar.unpacked 后再由主进程启动，避免打包后只在开发环境可用。
asarUnpack:
  - dist/ipc/heicWorker.js
  - dist/ipc/heicMetadata.js
  - dist/ipc/heicLimits.js
  # worker 在 app.asar.unpacked 中运行；把解码器及其 wasm/运行时依赖一并解包，
  # 避免生产包因 pnpm 的嵌套依赖或 asar 虚拟路径无法加载而静默失败。
  - node_modules/heic-convert/**/*
  - node_modules/heic-decode/**/*
  - node_modules/libheif-js/**/*
  - node_modules/jpeg-js/**/*
  - node_modules/pngjs/**/*

extraResources:
  - from: runtime-bundle/frontend
    to: frontend
  - from: runtime-bundle/java-engine.jar
    to: java-engine/camera-border-engine.jar
  - from: runtime-bundle/java-runtime
    to: java-runtime
  - from: runtime-bundle/professional-tools
    to: professional-tools
  - from: runtime-bundle/package-manifest.json
    to: package-manifest.json

mac:
  category: public.app-category.photography
  icon: build/icon.icns
  # 架构由命令行 --arm64 / --x64 指定（scripts/package-app.sh 每次装配对应架构的 JRE）
  target:
    - dmg
  # 代码签名（环境变量驱动，不要写死 identity: null，否则正式签名永远无法启用）：
  # - 配置 CSC_LINK（Developer ID Application 证书 .p12）+ CSC_KEY_PASSWORD 即自动签名；
  # - 公证另设 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID。
  # 未配置证书时 scripts/package-app.sh 显式传 --config.mac.identity=null 保持本地未签名构建。

win:
  artifactName: "Camera-Border-Setup-${version}-${arch}.${ext}"
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # 代码签名：配置 CSC_LINK（Windows 代码签名证书 .p12，EV 或 OV）+ CSC_KEY_PASSWORD
  # 后 electron-builder 自动对 NSIS 安装包签名（显著减少 SmartScreen 拦截）。未配置时不签名。

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Camera Border
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
